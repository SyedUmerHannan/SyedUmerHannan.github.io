name: Update side-quest widgets
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh FieldLevel + Duolingo JSON
        run: python3 scripts/update_side_quests.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fieldlevel.json data/duolingo.json
          git diff --staged --quiet || git commit -m "chore: refresh FieldLevel and Duolingo widgets"
          git push
