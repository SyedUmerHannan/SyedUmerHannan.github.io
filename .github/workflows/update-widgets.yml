name: Refresh site data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh FieldLevel + Duolingo
        run: python3 scripts/update_side_quests.py
        continue-on-error: true
      - name: Refresh Substack + Medium writing
        run: python3 scripts/update_writing.py
      - name: Refresh publications metrics
        run: python3 scripts/update_publications.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh writing and publications data"
            git push
          fi
